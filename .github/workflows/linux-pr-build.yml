name: Linux build (PR)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: linux-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          CI: true

      - name: Upload Linux .deb
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-pr
          path: src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

      - name: Job summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Linux .deb"
            echo ""
            echo "[Скачать артефакт](${ARTIFACT_URL}) (нужна авторизация в GitHub)"
            echo ""
            echo "Также: [страница этого запуска](${RUN_URL}) → раздел **Artifacts** внизу."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with download link
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = "<!-- neegde-linux-pr-artifact -->";
            const artifactUrl = process.env.ARTIFACT_URL || "";
            const runUrl = process.env.RUN_URL || "";
            const lines = [
              marker,
              "",
              "### Сборка Linux (.deb)",
              "",
              artifactUrl
                ? `[Скачать артефакт](${artifactUrl}) (нужна авторизация в GitHub)`
                : "Артефакт загружен — скачайте в разделе **Artifacts** на странице запуска.",
              "",
              `[Открыть запуск workflow](${runUrl})`,
            ];
            const body = lines.join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
