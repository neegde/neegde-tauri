name: Desktop release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libboost-all-dev

      - name: Install Boost (macOS)
        if: runner.os == 'macOS'
        run: brew install boost

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install boost-msvc-14.3 -y --no-progress
          $d = Get-ChildItem -LiteralPath 'C:\local' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'boost_*' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($null -eq $d) {
            Write-Error 'Boost install directory not found under C:\local after choco install'
            exit 1
          }
          "BOOST_ROOT=$($d.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          CI: true

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-macos
          path: src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: tauri-*
          merge-multiple: true

      - name: List files
        run: find release -type f

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          REPO="${{ github.repository }}"

          VERSION=$(node -p "require('./package.json').version")
          if [ "$REF_NAME" = "dev" ]; then
            TITLE="${VERSION}-dev"
            TAG="v${VERSION}-dev"
            VER_LABEL="${VERSION}-dev"
            PRERELEASE=(--prerelease)
          else
            TITLE="${VERSION}"
            TAG="v${VERSION}"
            VER_LABEL="${VERSION}"
            PRERELEASE=()
          fi

          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh api --method DELETE -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          mapfile -t FILES_RAW < <(find release -type f \( \
            -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \
          \) | sort)
          if [ ${#FILES_RAW[@]} -eq 0 ]; then
            echo "No installer files (.dmg/.exe/.msi/.deb) under release/"; exit 1
          fi

          mkdir -p release-upload
          for f in "${FILES_RAW[@]}"; do
            case "${f,,}" in
              *.dmg) out="NeegdeMacOS${VER_LABEL}.dmg" ;;
              *.exe) out="NeegdeWindows${VER_LABEL}.exe" ;;
              *.msi) out="NeegdeWindows${VER_LABEL}.msi" ;;
              *.deb) out="NeegdeLinux${VER_LABEL}.deb" ;;
              *.appimage) out="NeegdeLinux${VER_LABEL}.AppImage" ;;
              *) out="Neegde_${VER_LABEL}_$(basename "$f")" ;;
            esac
            cp "$f" "release-upload/$out"
          done
          mapfile -t FILES < <(find release-upload -maxdepth 1 -type f | sort)

          NOTES="Здесь будет чейнджлог"

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            "${PRERELEASE[@]}" \
            "${FILES[@]}"
