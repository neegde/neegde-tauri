# Сборка Windows + macOS и один общий релиз при каждом пуше в main (без ручных тегов).
# Релиз с тегом latest-main обновляется на каждый пуш (prerelease).
name: Desktop release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri
        run: npm run tauri build
        env:
          CI: true

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: tauri-*
          merge-multiple: true

      - name: List files
        run: find release -type f

      - name: Publish rolling release (latest-main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest-main
          REPO="${{ github.repository }}"

          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          gh api --method DELETE -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/git/refs/tags/$TAG" 2>/dev/null || true

          mapfile -t FILES < <(find release -type f)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No files under release/"; exit 1
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "нигде. · сборка с main" \
            --notes "Автоматическая сборка с ветки \`main\`.\n\n**Коммит:** \`${{ github.sha }}\`" \
            --prerelease \
            "${FILES[@]}"
