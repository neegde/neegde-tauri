[package]
name = "neegde"
version = "0.1.0"
description = "нигде."
authors = []
edition = "2021"

[lib]
name = "neegde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies"] }
reqwest_cookie_store = "0.8"
encoding_rs = "0.8"
base64 = "0.22"
librqbit = "8.1.1"
rlimit = "0.10"
tokio = { version = "1.50.0", features = ["net", "io-util", "sync", "time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
