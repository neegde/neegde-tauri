[package]
name = "neegde"
version = "0.1.9"
description = "нигде."
authors = []
edition = "2021"

[lib]
name = "neegde_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["cookies", "gzip"] }
reqwest_cookie_store = "0.8"
cookie = "0.18"
encoding_rs = "0.8"
base64 = "0.22"
md-5 = "0.10"
flate2 = "1"
bytes = "1"
librqbit = "8.1.1"
rlimit = "0.10"
tokio = { version = "1.50.0", features = ["net", "io-util", "sync", "time"] }
sysinfo = "0.32"
dashmap = "6"
lru = "0.12"
# Rich Presence: DISCORD_CLIENT_ID=<app id>; optional DISCORD_PRESENCE_BUTTON_URL (empty disables the button)
discord-rich-presence = "1.1"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Resolver — Brave Search's anti-bot challenge is Argon2id PoW; we need the
# algorithm, random salt bytes, and hex formatting to solve it.
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
# HTML title parsing for web-scrape resolver sources (Brave, DDG, Mojeek).
regex = "1"
lofty = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
