  <div v-if="resolving" class="sih sih--resolving">
    <span class="sih-spin" aria-hidden="true" />
    <span>Распознаём запрос…</span>
  </div>

  <div v-else-if="hasCanonical" class="sih">
    <span class="sih-label">Думаю, вы искали</span>
    <strong class="sih-canonical">«{{ canonicalText }}»</strong>
    <button
      type="button"
      class="sih-revert"
      :title="`Искать именно «${rawQuery}»`"
      @click="emit('revert-to-raw')"
    >
      нет, искать «{{ rawQuery }}»
    </button>
  </div>

  <div v-else-if="resolved && resolved.intent === 'raw'" class="sih sih--muted">
    <span>Каталоги ничего не распознали — ищу введённую строку.</span>
  </div>
